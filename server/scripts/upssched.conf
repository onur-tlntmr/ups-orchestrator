CMDSCRIPT /opt/ups-orchestrator/server/scripts/upssched-cmd
PIPEFN /run/nut/upssched.pipe
LOCKFN /run/nut/upssched.lock

# Event tags are encoded as <ups_id>:<event> so the wrapper script knows which
# UPS triggered the event and can POST it to /api/ups/<ups_id>/event.
#
# Add one block per UPS defined in ups_config.yml. Replace `server-ups` and
# `desktop-ups` with your actual UPS ids.

# --- Primary: server's own UPS -----------------------------------------------
AT ONBATT  server-ups EXECUTE server-ups:ONBATT
AT ONBATT  server-ups START-TIMER server-ups:desktop_suspend_due 300
AT ONLINE  server-ups EXECUTE server-ups:ONLINE
AT ONLINE  server-ups CANCEL-TIMER server-ups:desktop_suspend_due
AT LOWBATT server-ups EXECUTE server-ups:LOWBATT

# --- Observer: desktop's UPS (USB attached to this server) -------------------
# Note: no LOWBATT-driven server shutdown — the orchestrator handles it via upscmd.
AT ONBATT  desktop-ups EXECUTE desktop-ups:ONBATT
AT ONBATT  desktop-ups START-TIMER desktop-ups:desktop_suspend_due 300
AT ONLINE  desktop-ups EXECUTE desktop-ups:ONLINE
AT ONLINE  desktop-ups CANCEL-TIMER desktop-ups:desktop_suspend_due
AT LOWBATT desktop-ups EXECUTE desktop-ups:LOWBATT
