# UPS Orchestrator - Device Configuration
#
# Copy this file to ups_config.yml and adjust for your setup.
#
# Each entry defines a UPS physically attached to THIS server (USB).
#
# Roles:
#   primary  — this server's own UPS. LOWBATT triggers `upsmon -c fsd` so the
#              server itself shuts down. Use one (or more) of these.
#   observer — a secondary UPS (typically the desktop's UPS, with its USB
#              cable plugged into this server). The orchestrator never shuts
#              down the server because of an observer UPS. Instead, when
#              action is required (LOWBATT, or offline_wait timer expired),
#              it sends `upscmd <ups> <upscmd.shutdown>` so the UPS powers
#              itself off cleanly. This protects the desktop's battery while
#              the desktop is unattended (e.g. shut down after a previous
#              outage).
#
# In `upsmon.conf`, primary UPSes should be MONITOR'ed with powerval=1 and
# observer UPSes with powerval=0 — that way an observer's LOWBATT alone won't
# pull the server down.

ups_devices:

  - id: "server-ups"
    nut_name: "server-ups@localhost"
    role: "primary"

    timing:
      desktop_offline_wait: 300       # Desktop off / no desktop → wait 5 min then fsd
      desktop_online_prompt_wait: 180 # Desktop online → prompt user, give 180 s
      desktop_suspend_wait: 360       # Desktop suspended → wait ~6.5 min before waking
      desktop_shutdown_wait: 60       # After issuing shutdown, wait 60 s for confirmation
      wake_online_timeout: 60         # After WoL, wait up to 60 s for desktop to come online

    # Optional: send WoL via SSH on a relay host (e.g. Proxmox host) instead of locally.
    # Useful when the server runs inside a VM and the bridge blocks broadcast frames.
    # wol_relay:
    #   host: "root@192.168.50.1"
    #   identity_file: "/root/.ssh/wol_key"  # omit to use the default SSH key

    # No desktop: block needed — desktop connection info is inherited automatically
    # from the observer UPS (desktop-ups) below.

  # The desktop's UPS — physically connected to this server via USB.
  # Server never self-shuts because of this UPS, but coordinates the desktop
  # and powers the UPS off cleanly when needed.
  - id: "desktop-ups"
    nut_name: "desktop-ups@localhost"
    role: "observer"

    timing:
      desktop_offline_wait: 300        # Desktop offline → wait then send upscmd shutdown
      desktop_online_prompt_wait: 180
      desktop_suspend_wait: 400
      desktop_shutdown_wait: 60
      wake_online_timeout: 60
      # Once this observer's grace timer expires it does NOT cut power immediately:
      # it waits for the desktop to be confirmed down by the primary (which may
      # still be waking & shutting it down), so it never yanks power from a
      # running/suspended desktop. This is the battery-safety backstop for how long
      # to hold. Keep it comfortably above the primary's worst case
      # (desktop_suspend_wait + wake_online_timeout + desktop_shutdown_wait).
      observer_poweroff_max_wait: 1800

    # Instant command used to power the UPS off cleanly. Driver-dependent —
    # run `upscmd -l desktop-ups@localhost` to list supported commands.
    # `shutdown.return` powers the UPS off and back on when mains returns.
    upscmd:
      shutdown: "shutdown.return"

    desktop:
      agent_url: "http://192.168.50.2:8788"
      mac_address: "AA:BB:CC:DD:EE:FF"
