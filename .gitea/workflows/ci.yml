# Tests every push; on a v* tag also builds the two RPMs, each on the distro it is installed on,
# and publishes them to the instance's RPM registry. Runs on ups-ci-runner on ci-01 (packaging/ci/;
# labels rocky-10 and fedora-44 are stock distro images, so each job installs what it needs
# first), and waits for tella's builds on the same VM through a shared build lock.
name: ci

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    # The server's distro, so the tests run against the Python it is installed with.
    runs-on: rocky-10
    steps:
      # First, before dnf: tella builds on the same VM and must not share it with us.
      - name: Wait for the build lock
        env:
          LOCK_MODE: shared
          LOCK_WAIT: "2700"   # 45m; tella holds it for at most its 25m job timeout
          LOCK_HOLD: "3600"   # this runner's 1h job timeout
        run: |
          # The VM-wide build lock (/run/ci-locks on the runner host): tella holds it exclusively,
          # ups-orchestrator jobs share it, so the two never build at the same time. A background
          # flock keeps it for the rest of the job — at most LOCK_HOLD seconds (the runner timeout), so
          # a job container left behind by a runner restart cannot keep it forever. Removing the job
          # container releases it.
          if ! mountpoint -q /locks; then
            echo "/locks is not mounted: add '-v /run/ci-locks:/locks' (':z' unless privileged) to" >&2
            echo "container.options and '/run/ci-locks' to valid_volumes in the runner's config.yaml" >&2
            exit 1
          fi
          rm -f /tmp/build-lock-held /tmp/build-lock.err
          setsid flock "--$LOCK_MODE" --wait "$LOCK_WAIT" /locks/build.lock \
            sh -c 'touch /tmp/build-lock-held; exec sleep "$LOCK_HOLD"' \
            </dev/null >/dev/null 2>/tmp/build-lock.err &
          holder=$!
          echo "waiting for the $LOCK_MODE build lock (up to ${LOCK_WAIT}s)"
          until [ -e /tmp/build-lock-held ]; do
            if ! kill -0 "$holder" 2>/dev/null; then
              if [ -s /tmp/build-lock.err ]; then
                echo "flock failed: $(cat /tmp/build-lock.err)" >&2
              else
                echo "no $LOCK_MODE build lock within ${LOCK_WAIT}s; the other project is still building" >&2
              fi
              exit 1
            fi
            sleep 2
          done
          echo "build lock held ($LOCK_MODE)"

      # git before checkout, or actions/checkout falls back to a tarball without .git;
      # nodejs because checkout is a JavaScript action.
      - name: Install tools
        run: |
          dnf -y -q install epel-release
          dnf -y -q --enablerepo=crb install git nodejs curl tzdata \
            python3-pytest python3-flask python3-requests python3-pyyaml

      - name: Checkout
        uses: actions/checkout@v4

      - name: Test
        run: python3 -m pytest -q tests/

  package:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: server
            runner: rocky-10
          - component: desktop
            runner: fedora-44
    runs-on: ${{ matrix.runner }}
    steps:
      # First, before dnf: tella builds on the same VM and must not share it with us.
      - name: Wait for the build lock
        env:
          LOCK_MODE: shared
          LOCK_WAIT: "2700"   # 45m; tella holds it for at most its 25m job timeout
          LOCK_HOLD: "3600"   # this runner's 1h job timeout
        run: |
          # The VM-wide build lock (/run/ci-locks on the runner host): tella holds it exclusively,
          # ups-orchestrator jobs share it, so the two never build at the same time. A background
          # flock keeps it for the rest of the job — at most LOCK_HOLD seconds (the runner timeout), so
          # a job container left behind by a runner restart cannot keep it forever. Removing the job
          # container releases it.
          if ! mountpoint -q /locks; then
            echo "/locks is not mounted: add '-v /run/ci-locks:/locks' (':z' unless privileged) to" >&2
            echo "container.options and '/run/ci-locks' to valid_volumes in the runner's config.yaml" >&2
            exit 1
          fi
          rm -f /tmp/build-lock-held /tmp/build-lock.err
          setsid flock "--$LOCK_MODE" --wait "$LOCK_WAIT" /locks/build.lock \
            sh -c 'touch /tmp/build-lock-held; exec sleep "$LOCK_HOLD"' \
            </dev/null >/dev/null 2>/tmp/build-lock.err &
          holder=$!
          echo "waiting for the $LOCK_MODE build lock (up to ${LOCK_WAIT}s)"
          until [ -e /tmp/build-lock-held ]; do
            if ! kill -0 "$holder" 2>/dev/null; then
              if [ -s /tmp/build-lock.err ]; then
                echo "flock failed: $(cat /tmp/build-lock.err)" >&2
              else
                echo "no $LOCK_MODE build lock within ${LOCK_WAIT}s; the other project is still building" >&2
              fi
              exit 1
            fi
            sleep 2
          done
          echo "build lock held ($LOCK_MODE)"

      - name: Install tools
        run: dnf -y -q install git nodejs rpm-build python3-devel systemd-rpm-macros jq

      - name: Checkout
        uses: actions/checkout@v4

      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Resolve version
        run: |
          version="$(awk '/^Version:/{print $2; exit}' packaging/rpm/ups-orchestrator.spec)"
          [ -n "$version" ] || { echo "no Version: in the spec" >&2; exit 1; }
          # The tag names the release, the spec names the packages; they must agree.
          case "$GITHUB_REF" in
            refs/tags/*)
              tag="${GITHUB_REF#refs/tags/}"
              if [ "$tag" != "v$version" ]; then
                echo "tag $tag does not match Version: $version in packaging/rpm/ups-orchestrator.spec" >&2
                exit 1
              fi
              ;;
          esac
          echo "UPS_VERSION=$version" >> "$GITHUB_ENV"
          echo "version: $version"

      - name: Build
        run: packaging/rpm/build-rpm.sh --out=dist --only=${{ matrix.component }}

      # v3: v4 fails against Gitea with GHESNotSupportedError.
      - name: Keep the RPM as a workflow artifact
        uses: actions/upload-artifact@v3
        with:
          name: ups-orchestrator-${{ matrix.component }}-${{ env.UPS_VERSION }}
          path: dist/*.rpm

      # Only a tag publishes: its tag check ties the version to the code. A manual run from a
      # branch would replace the published package of the same version with other content,
      # which no client would ever upgrade to.
      - name: Publish to the RPM registry
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITEA_TOKEN: ${{ secrets.PACKAGE_TOKEN || github.token }}
        run: packaging/ci/publish-rpm.sh --dir=dist --version="$UPS_VERSION" --keep=3
